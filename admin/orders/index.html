<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom stays allowed (accessibility). viewport-fit=cover so the
         installed PWA paints under the iOS status bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#292524" />

    <title>CR8R</title>
    <meta name="description" content="CR8R. A production house for streetwear brands: from a photo to a finished piece, made in Portugal." />
    <meta name="author" content="CR8R" />

    <!-- Inline SVG favicon: CR8R orange wordmark monogram on charcoal -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23292524'/><text x='50' y='62' font-family='Inter,system-ui,sans-serif' font-size='42' font-weight='800' text-anchor='middle' fill='%23E8775D'>CR</text><text x='50' y='86' font-family='Inter,system-ui,sans-serif' font-size='14' font-weight='600' text-anchor='middle' fill='%23E8775D' letter-spacing='2'>8R</text></svg>" />

    <!-- Installed app (iOS). The manifest link is injected by
         vite-plugin-pwa at build time. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CR8R" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />

    <!-- Both families are served from this origin (see the @font-face block at
         the top of src/index.css). The Google stylesheet used to be deferred,
         so the first paint used the system font and the page recomposed itself
         once it arrived. These two are the faces the first screen needs:
         Montserrat 300 draws the display line, Inter 400 the line under it. -->
    <link rel="preload" href="/fonts/montserrat-300-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin>

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CR8R" />
    <meta property="og:description" content="CR8R. A production house for streetwear brands: from a photo to a finished piece, made in Portugal." />
    <meta property="og:site_name" content="CR8R" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CR8R" />
    <meta name="twitter:description" content="CR8R. A production house for streetwear brands: from a photo to a finished piece, made in Portugal." />
    <script type="module" crossorigin src="/assets/index-CcA1erg5.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BrVQBUja.css">
  <link rel="manifest" href="/manifest.webmanifest"></head>

  <body>
    <div id="root"></div>
  </body>
</html>
