<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom stays allowed (accessibility). viewport-fit=cover so the
         installed PWA paints under the iOS status bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#292524" />

    <title>CR8R</title>
    <!-- The public page's words (2026-09-29): what a link preview shows in an
         Instagram DM, WhatsApp or iMessage before the page opens. The public
         face is ATLR404 Private; CR8R is never on it. -->
    <meta name="description" content="Custom fashion production in Portugal’s luxury ateliers, from 50 pieces. Entry by application." />
    <meta name="author" content="CR8R" />

    <!-- Inline SVG favicon: CR8R orange wordmark monogram on charcoal -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23292524'/><text x='50' y='62' font-family='Inter,system-ui,sans-serif' font-size='42' font-weight='800' text-anchor='middle' fill='%23E8775D'>CR</text><text x='50' y='86' font-family='Inter,system-ui,sans-serif' font-size='14' font-weight='600' text-anchor='middle' fill='%23E8775D' letter-spacing='2'>8R</text></svg>" />

    <!-- Installed app (iOS). The manifest link is injected by
         vite-plugin-pwa at build time. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CR8R" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />

    <!-- Both families are served from this origin (see the @font-face block at
         the top of src/index.css). The Google stylesheet used to be deferred,
         so the first paint used the system font and the page recomposed itself
         once it arrived. These two are the faces the first screen needs:
         Inter 300 draws the display line, Inter 400 the line under it. -->
    <link rel="preload" href="/fonts/inter-300-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin>

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ATLR404 Private" />
    <meta property="og:description" content="Custom fashion production in Portugal’s luxury ateliers, from 50 pieces. Entry by application." />
    <meta property="og:site_name" content="ATLR404 Private" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ATLR404 Private" />
    <meta name="twitter:description" content="Custom fashion production in Portugal’s luxury ateliers, from 50 pieces. Entry by application." />
    <!-- The public page is black from the first paint (2026-09-29 audit: the
         back office's grey grid showed for up to two seconds before it). The
         router takes the class off again if it sends the visitor elsewhere. -->
    <script>
      // GitHub Pages serves "/apply" as "/apply/": the slash never matters.
      var publicPath = location.pathname.replace(/\/+$/, "") || "/";
      if (publicPath === "/" || publicPath === "/apply") {
        document.documentElement.classList.add("public-surface");
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute("content", "#0a0a0a");
        // The public face is ATLR404 Private, never CR8R: the tab, its icon
        // and the name a phone gives the page on its home screen.
        document.title = "ATLR404 Private \u00b7 Custom fashion production";
        var icon = document.querySelector('link[rel="icon"]');
        if (icon) icon.setAttribute("data-app-href", icon.getAttribute("href"));
        if (icon) icon.setAttribute("href", "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0a0a'/><circle cx='50' cy='50' r='26' fill='none' stroke='%23ffffff' stroke-width='5'/></svg>");
        var appTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appTitle) appTitle.setAttribute("content", "ATLR404");
      }
    </script>
    <script type="module" crossorigin src="/assets/index-BCL2X7xT.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BrbK9FLa.css">
  <link rel="manifest" href="/manifest.webmanifest"></head>

  <body>
    <div id="root"></div>
  </body>
</html>
